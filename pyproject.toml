[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyzr-fde-takehome"
version = "0.1.0"
description = "Lyzr FDE take-home: eleven production-minded agent projects over a shared core."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]
graph = ["langgraph>=0.2"]

# agentcore is installed separately from ./core (see the install target).
[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "p01-structured-output/tests", "p02-rag-citations/tests",
             "p03-react-planner/tests", "p04-tool-orchestrator/tests",
             "p05-memory-agent/tests", "p06-hitl-approval/tests",
             "p07-cost-router/tests", "p08-event-automation/tests",
             "p09-debate/tests", "p10-self-reflective/tests",
             "p11-observability/tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:agentcore.*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
